name: Apply main ruleset

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply repository ruleset
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RULESET_TOKEN is not configured. Add a repository admin PAT as RULESET_TOKEN, or run bash .github/scripts/apply-ruleset.sh locally." >&2
            exit 1
          fi
          bash .github/scripts/apply-ruleset.sh
