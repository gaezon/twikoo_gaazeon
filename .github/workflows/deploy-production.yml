name: Deploy Twikoo to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-twikoo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Pull Vercel environment information
        run: npx --yes vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel project
        run: npx --yes vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy project artifacts to Vercel
        run: npx --yes vercel@59.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
