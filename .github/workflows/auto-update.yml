name: Auto Update Twikoo

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger
    inputs:
      test_notification:
        description: 'Send a test notification'
        required: false
        default: false
        type: boolean

jobs:
  update-twikoo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need permission to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Check for updates
        id: check_updates
        run: |
          ncu -u twikoo-vercel
          if git diff --exit-code package.json; then
            echo "No updates found"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Updates found"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: update twikoo-vercel to latest version"
          git push

      - name: Notify Telegram (Success)
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_TO }} \
          -d text="✅ Twikoo Vercel Updated! New version deployed."

      - name: Check for staleness
        id: check_stale
        run: |
          last_commit=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          diff=$((current_time - last_commit))
          days=$((diff / 86400))
          echo "Days since last commit: $days"
          if [ $days -gt 50 ]; then
            echo "is_stale=true" >> $GITHUB_OUTPUT
          else
            echo "is_stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram (Stale Warning)
        if: steps.check_stale.outputs.is_stale == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_TO }} \
          -d text="⚠️ Warning: Twikoo Vercel repo has been inactive for over 50 days. GitHub Actions may pause this workflow soon. Please manually trigger a run or push a commit."

      - name: Notify Telegram (Test)
        if: github.event.inputs.test_notification == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_TO }} \
          -d text="🧪 Test Notification: Telegram integration is working correctly!"
