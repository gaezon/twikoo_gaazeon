name: Apply push protection

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply secret scanning push protection
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RULESET_TOKEN is not configured. Add a repository admin PAT as RULESET_TOKEN, or run bash .github/scripts/apply-push-protection.sh locally." >&2
            exit 1
          fi
          bash .github/scripts/apply-push-protection.sh
